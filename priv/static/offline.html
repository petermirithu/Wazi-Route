<!DOCTYPE html>
<html lang="en" data-theme="wazi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#273f30" />
    <meta name="description" content="Wazi Route is temporarily offline. Reconnect to continue planning your journey." />
    <title>You're offline — Wazi Route</title>
    <link rel="stylesheet" href="/assets/css/app.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logos/apple-touch-icon.png" />
  </head>
  <body class="min-h-dvh overflow-x-hidden bg-base-100 font-sans text-base-content antialiased selection:bg-accent selection:text-accent-content [&_:focus-visible]:outline-2 [&_:focus-visible]:outline-offset-4 [&_:focus-visible]:outline-primary">
    <div class="wazi-kitenge-border h-1.5" aria-hidden="true"></div>

    <header class="border-b border-base-300/70 bg-base-100/95">
      <div class="mx-auto flex min-h-20 max-w-[1440px] items-center justify-between gap-4 px-5 sm:px-8 lg:px-12">
        <div class="inline-flex items-center gap-2.5" aria-label="Wazi Route">
          <img src="/images/wazi-mark.png" alt="" width="166" height="172" class="h-11 w-11 object-contain mix-blend-multiply" />
          <img src="/images/wazi-wordmark.png" alt="Wazi Route" width="280" height="43" class="h-auto w-30 object-contain mix-blend-multiply sm:w-36" />
        </div>
        <span class="inline-flex min-h-10 items-center gap-2 rounded-full border border-base-300 bg-base-200 px-3 text-xs font-semibold text-primary sm:px-4">
          <span class="size-2 rounded-full bg-secondary" aria-hidden="true"></span>
          Offline
        </span>
      </div>
    </header>

    <main id="offline-content" tabindex="-1">
      <section class="relative isolate overflow-hidden bg-base-200" aria-labelledby="offline-title">
        <div class="wazi-pattern-light absolute inset-0 -z-10 opacity-70" aria-hidden="true"></div>
        <div class="mx-auto grid min-h-[calc(100dvh-5.375rem)] max-w-[1440px] items-center gap-12 px-5 py-12 sm:px-8 sm:py-16 lg:grid-cols-[1fr_1.05fr] lg:px-12 lg:py-20">
          <div class="max-w-2xl">
            <p class="text-xs font-bold uppercase tracking-[0.18em] text-secondary">Connection paused</p>
            <h1 id="offline-title" class="mt-4 text-[clamp(2.65rem,6.4vw,6rem)] leading-[0.98] font-bold tracking-[-0.045em] text-primary">
              Off the grid.<br /><span class="text-secondary">Not off course.</span>
            </h1>
            <p class="mt-7 max-w-xl text-base leading-8 text-base-content/75 sm:text-lg">
              Wazi Route can't reach the internet right now. Reconnect, then carry on from where you left off.
            </p>

            <div class="mt-9 flex flex-wrap items-center gap-4">
              <a id="offline-retry" href="/" class="group inline-flex min-h-14 items-center gap-4 rounded-lg bg-secondary px-6 py-3 text-sm font-bold text-secondary-content shadow-[5px_5px_0_#273f30] transition hover:-translate-y-1 hover:shadow-[7px_7px_0_#273f30] motion-reduce:transform-none">
                Try again
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-5 transition-transform group-hover:rotate-45" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v4.2h4.2" />
                </svg>
              </a>
            </div>

            <div class="mt-11 flex max-w-xl items-start gap-3 border-t border-primary/20 pt-6 text-xs leading-6 text-base-content/65">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="mt-0.5 size-5 shrink-0 text-secondary" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.8 2.5 17.3A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.7L13.7 3.8a2 2 0 0 0-3.4 0Z" />
              </svg>
              <p>Live routes, traffic, and road conditions aren't available offline. Wazi Route does not provide offline navigation.</p>
            </div>
          </div>

          <div class="relative lg:pl-4">
            <div class="absolute -top-6 -right-6 hidden size-32 grid-cols-4 gap-2 lg:grid" aria-hidden="true">
              <span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span>
              <span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span>
              <span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span>
              <span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span><span class="size-2.5 rounded-full bg-accent"></span>
            </div>
            <figure class="relative h-[360px] overflow-hidden rounded-[2rem_2rem_7rem_2rem] border-[6px] border-base-100 bg-primary shadow-xl sm:h-[500px] lg:h-[590px]">
              <img src="/images/forest-road-small.jpg" alt="An open road winding through a wooded landscape" width="900" height="506" class="size-full object-cover object-[58%_center]" />
              <div class="absolute inset-0 bg-linear-to-t from-neutral/80 via-neutral/10 to-transparent" aria-hidden="true"></div>
              <figcaption class="absolute right-7 bottom-8 left-7 sm:right-11 sm:bottom-11 sm:left-11">
                <span class="inline-flex size-12 items-center justify-center rounded-full bg-accent text-accent-content" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.3 15.7a4.5 4.5 0 0 1 6.4 0M5.5 12.9a8.5 8.5 0 0 1 13 0M2.7 10a12.5 12.5 0 0 1 18.6 0M12 19h.01" />
                  </svg>
                </span>
                <p class="mt-4 max-w-sm text-2xl leading-tight font-semibold text-white sm:text-4xl">Every good journey has a pause.</p>
              </figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
