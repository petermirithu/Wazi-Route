<!DOCTYPE html>
<html lang="en" data-theme="bumblebee">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16445a" />
    <title>You're offline — Wazi Route</title>
    <link rel="stylesheet" href="/assets/css/app.css" />
  </head>
  <body class="grid min-h-dvh place-items-center bg-base-200 p-6 font-sans text-base-content antialiased">
    <main id="offline-content" class="w-full max-w-lg rounded-box bg-base-100 p-8 sm:p-12">
      <img src="/images/logos/web-app-manifest-192x192.png" alt="Wazi Route" width="192" height="192" class="mb-8 size-20 rounded-box" />
      <h1 class="text-3xl font-semibold text-primary">A little off the grid.</h1>
      <p class="mt-5 leading-8">You're offline. Reconnect to the internet to open Wazi Route.</p>
      <p class="mt-4 text-sm leading-7 text-base-content/75">Live routes, traffic, and road conditions aren't available offline. This isn't an offline navigation app.</p>
      <a id="offline-retry" href="/" class="mt-8 inline-flex min-h-12 items-center justify-center rounded-field bg-neutral px-6 py-3 font-semibold text-neutral-content hover:bg-secondary focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary">Try again</a>
    </main>
  </body>
</html>
